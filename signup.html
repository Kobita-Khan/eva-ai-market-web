<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8fbff"><title>创建账户｜EVA AI 市场</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/eva-premium-2026.css?v=20260922-1"><style>body{font-family:Inter,sans-serif}.auth-shell{width:min(100%,520px);padding:24px}.auth-card{padding:30px;border:1px solid #202a39;border-radius:24px;background:linear-gradient(180deg,#0f1621,#080d14);box-shadow:0 24px 80px #0008}.brand{display:flex;gap:10px;align-items:center;color:#fff;text-decoration:none;font-weight:800}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#6d5dfc,#8b5cf6);font-size:22px}.auth-card h1{font-size:28px;margin:28px 0 6px}.auth-card p{color:#8e9aab}.auth-card label{display:block;margin-top:16px;font-size:12px;font-weight:700}.auth-card input{width:100%;height:48px;margin-top:7px;padding:0 13px;border-radius:12px;border:1px solid #263244;background:#080d14;color:#fff;outline:0}.auth-card input:focus{border-color:#6d5dfc}.cta{width:100%;height:50px;margin-top:20px;border:0;border-radius:12px;color:#fff;font-weight:800;background:linear-gradient(135deg,#6d5dfc,#8b5cf6)}#status{min-height:20px;font-size:12px;text-align:center;margin-top:12px}.links{text-align:center;margin-top:18px;font-size:12px}.links a{color:#8fa3ff}</style><link rel="stylesheet" href="/auth-white-premium.css?v=20260923-step4">
</head><body class="eva-auth-page"><main class="auth-shell"><section class="auth-card"><a class="brand" href="/"><span class="mark">E</span><span>EVA AI MARKET</span></a><h1>创建您的账户</h1><p>使用邮箱和密码访问订单、钱包和商品。</p><form id="form"><label>邮箱<input id="email" type="email" autocomplete="email" required></label><label>密码<input id="password" type="password" autocomplete="new-password" minlength="8" required></label><button class="cta" type="submit">创建账户</button></form><div id="status"></div><div class="links">已有账户？ <a href="/login.html">登录</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let c;const s=document.getElementById('status');(async()=>{try{const r=await fetch('/api/config');const x=await r.json();c=supabase.createClient(x.url,x.anonKey,{auth:{persistSession:true,autoRefreshToken:true}})}catch(e){s.textContent='Account service unavailable.'}})();document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(!c)return;const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;s.textContent='Creating account…';const {data,error}=await c.auth.signUp({email,password});if(error){s.textContent=error.message;return}if(!data.session){s.textContent='Email confirmation is enabled. Check your email.';return}const next=new URLSearchParams(location.search).get('next');location.replace(next&&next.startsWith('/')&&!next.startsWith('//')?next:'/dashboard.html')});</script><script src="/eva-premium-runtime.js?v=20260922-1"></script></body></html>
