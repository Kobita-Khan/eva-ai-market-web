<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="auth-shell"><section class="panel auth-card"><h1>Reassign pending deposit</h1><p>Move a pending TxID to the correct registered customer before approval.</p><form id="form"><label>Customer email<input id="email" type="email" value="maksbymoz62@gmail.com" required></label><label>Full transaction ID<input id="txid" type="text" value="0x92e688180c4a1329c51d9ae189fc911e24aa0c7de40ab17f518f6a74996e5b68" required></label><button class="button primary" type="submit">Reassign deposit</button></form><p id="notice" class="dash-notice"></p><p><a href="/eva-ops-93k7m2">Back to Admin Panel</a></p></section></main><script>(async()=>{const notice=document.getElementById('notice'),form=document.getElementById('form');const config=await fetch('/api/config').then(r=>r.json());const client=supabase.createClient(config.url,config.anonKey);form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;notice.textContent='Reassigning…';notice.className='dash-notice';try{let{data:{session}}=await client.auth.getSession();if(!session){location.href='/login.html';return}const response=await fetch('/api/admin/approve',{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${session.access_token}`},body:JSON.stringify({action:'reassign',email:document.getElementById('email').value.trim(),transactionId:document.getElementById('txid').value.trim()})});const body=await response.json();if(!response.ok)throw new Error(body.error||'Reassignment failed.');notice.textContent=body.reassigned?`Deposit reassigned to ${body.email}. You can now approve it from the Admin Panel.`:body.message;notice.className='dash-notice success'}catch(error){notice.textContent=error.message;notice.className='dash-notice error'}finally{button.disabled=false}})})()</script></body></html>
