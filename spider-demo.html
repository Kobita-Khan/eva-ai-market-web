<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EVA Walking Spider Demo</title><style>*{box-sizing:border-box}body{margin:0;min-height:180vh;background:radial-gradient(circle at 60% 10%,#10244b,#050914 45%,#02040a);color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow-x:hidden}.page{padding:22px}.nav{height:72px;border:1px solid #263b66;border-radius:18px;display:flex;align-items:center;padding:0 18px;font-weight:900;font-size:20px;background:#07101dcc}.hero{padding:55px 8px 30px}.hero small{color:#67e8f9}.hero h1{font-size:44px;line-height:.98;margin:14px 0;background:linear-gradient(90deg,#fff,#a855f7,#22d3ee);-webkit-background-clip:text;color:transparent}.hero p{color:#a9b7ce;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{height:150px;border:1px solid #263b66;border-radius:20px;padding:18px;background:#091426cc}.spider{position:fixed;left:0;top:0;width:92px;height:76px;z-index:999999;pointer-events:none;filter:drop-shadow(0 10px 8px #0009);transform-origin:50% 50%;will-change:transform}.body{position:absolute;width:38px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#6f442a,#21140f 42%,#050505 75%);left:27px;top:16px;box-shadow:inset 0 0 8px #b56a32aa}.head{position:absolute;width:27px;height:25px;border-radius:50%;background:#130d0b;left:33px;top:5px}.eye{position:absolute;width:3px;height:3px;border-radius:50%;background:#ff552e;box-shadow:7px 0 #ff552e;left:39px;top:10px}.leg{position:absolute;width:40px;height:6px;background:linear-gradient(90deg,#17100d,#6d4028,#090706);border-radius:99px;transform-origin:0 50%;left:45px;top:34px}.l1{transform:rotate(-62deg);animation:leg1 .42s ease-in-out infinite alternate}.l2{transform:rotate(-25deg);animation:leg2 .46s ease-in-out infinite alternate}.l3{transform:rotate(25deg);animation:leg1 .44s ease-in-out infinite alternate}.l4{transform:rotate(62deg);animation:leg2 .4s ease-in-out infinite alternate}.r{left:47px;transform-origin:0 50%}.left{left:45px;transform:scaleX(-1)}@keyframes leg1{to{rotate:12deg}}@keyframes leg2{to{rotate:-12deg}}.note{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;background:#0b1730e8;border:1px solid #38bdf866;border-radius:999px;padding:10px 15px;font-size:12px;color:#c9efff;white-space:nowrap}@media(prefers-reduced-motion:reduce){.spider{display:none}}</style></head><body><div class="page"><div class="nav">♛ EVA AI MARKET</div><section class="hero"><small>LIVE MOTION DEMO</small><h1>Spider walks across the screen</h1><p>Scroll up or down. The spider stays attached to the viewport and continuously chooses a new point on the visible screen.</p></section><div class="cards"><div class="card">ChatGPT Plus</div><div class="card">Claude Pro</div><div class="card">Gemini Ultra</div><div class="card">AWS Cloud</div><div class="card">Products</div><div class="card">Secure Payment</div></div></div><div class="spider" id="spider"><i class="leg l1"></i><i class="leg l2"></i><i class="leg l3"></i><i class="leg l4"></i><i class="leg l1 left"></i><i class="leg l2 left"></i><i class="leg l3 left"></i><i class="leg l4 left"></i><b class="body"></b><b class="head"></b><b class="eye"></b></div><div class="note">🕷️ LIVE — always walking on screen</div><script>(()=>{const s=document.getElementById('spider');let x=40,y=120,a=0,tx=innerWidth*.7,ty=innerHeight*.35,last=0;function target(){const m=55;tx=m+Math.random()*Math.max(10,innerWidth-m*2);ty=m+Math.random()*Math.max(10,innerHeight-m*2)}function frame(t){if(!last)last=t;const dx=tx-x,dy=ty-y,d=Math.hypot(dx,dy);if(d<35)target();const speed=Math.min(2.0,Math.max(.7,d/180));x+=dx/(d||1)*speed;y+=dy/(d||1)*speed;a=Math.atan2(dy,dx)*180/Math.PI+90;const bob=Math.sin(t/90)*2;s.style.transform=`translate3d(${x-46}px,${y-38+bob}px,0) rotate(${a}deg)`;requestAnimationFrame(frame)}addEventListener('resize',target);target();requestAnimationFrame(frame)})();</script></body></html>
