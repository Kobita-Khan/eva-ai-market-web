<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070c"><title>Forgot Password — EVA AI MARKET</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/eva-premium-2026.css?v=20260922-1"><style>body{font-family:Inter,sans-serif}.auth-shell{width:min(100%,520px);padding:24px}.auth-card{padding:30px;border:1px solid #202a39;border-radius:24px;background:linear-gradient(180deg,#0f1621,#080d14);box-shadow:0 24px 80px #0008}.brand{display:flex;gap:10px;align-items:center;color:#fff;text-decoration:none;font-weight:800}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#6d5dfc,#8b5cf6);font-size:22px}.auth-card h1{font-size:28px;margin:28px 0 6px}.auth-card p{color:#8e9aab}.auth-card label{display:block;margin-top:16px;font-size:12px;font-weight:700}.auth-card input{width:100%;height:48px;margin-top:7px;padding:0 13px;border-radius:12px;border:1px solid #263244;background:#080d14;color:#fff;outline:0}.cta{width:100%;height:50px;margin-top:20px;border:0;border-radius:12px;color:#fff;font-weight:800;background:linear-gradient(135deg,#6d5dfc,#8b5cf6)}#status{min-height:20px;font-size:12px;text-align:center;margin-top:12px}.links{text-align:center;margin-top:18px;font-size:12px}.links a{color:#8fa3ff}</style></head><body class="eva-auth-page"><main class="auth-shell"><section class="auth-card"><a class="brand" href="/"><span class="mark">E</span><span>EVA AI MARKET</span></a><h1>Reset your password</h1><p>Enter your account email. We’ll send a secure reset link.</p><form id="form"><label>Email<input id="email" type="email" autocomplete="email" required></label><button class="cta" type="submit">Send Reset Link</button></form><div id="status"></div><div class="links"><a href="/login.html">Back to sign in</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let c;const s=document.getElementById('status');(async()=>{try{const r=await fetch('/api/config');const x=await r.json();c=supabase.createClient(x.url,x.anonKey)}catch(e){s.textContent='Account service unavailable.'}})();document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(!c)return;const email=document.getElementById('email').value.trim().toLowerCase();s.textContent='Sending reset link…';const {error}=await c.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password.html'});s.textContent=error?error.message:'Reset email sent. Check your inbox.'});</script><script src="/eva-premium-runtime.js?v=20260922-1"></script></body></html>
