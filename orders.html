</style><link rel="stylesheet" href="/eva-reference-final.css?v=20260923-final11"><link rel="stylesheet" href="/eva-reference-exact.css?v=20260923-exact3"></head><body class="reference-orders"><main class="app"><header class="top"><button class="back" onclick="history.back()">‹</button><b>我的订单</b></header><div class="tabs"><button class="active" data-filter="all">全部</button><button data-filter="pending">待处理</button><button data-filter="completed">已完成</button><button data-filter="cancelled">已取消</button></div><section class="orders" id="orders"><p class="notice">正在加载订单…</p></section><p class="notice" id="notice"></p><nav class="bottom"><a href="/"><span>⌂</span>首页</a><a href="/categories.html"><span>▦</span>分类</a><a href="/products.html"><span>🛒</span>产品</a><a class="active" href="/orders.html"><span>▤</span>订单</a><a href="/profile.html"><span>♙</span>我的</a></nav></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const box=document.getElementById('orders'),notice=document.getElementById('notice');try{const c=await fetch('/api/config').then(r=>r.json());const sb=supabase.createClient(c.url,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('/login.html?next=/orders.html');return}const [orderResponse,catalogResponse]=await Promise.all([fetch('/api/store?view=orders',{headers:{authorization:'Bearer '+session.access_token}}),fetch('/api/store',{cache:'no-store'})]);const b=await orderResponse.json();const catalogBody=await catalogResponse.json().catch(()=>({}));if(!orderResponse.ok)throw new Error(b.error||'无法加载订单');const rows=b.orders||[];const catalog=Array.isArray(catalogBody.products)?catalogBody.products:[];const productLogo=o=>{const p=catalog.find(x=>String(x.id)===String(o.product_id))||catalog.find(x=>String(x.name).toLowerCase()===String(o.product_name).toLowerCase());const url=String(p?.logo_url||'').trim()||(()=>{const d=String(p?.brand_domain||'').trim();return d?'https://www.google.com/s2/favicons?domain='+encodeURIComponent(d)+'&sz=128':''})();return url?'<img class="eva-official-logo" src="'+esc(url)+'" alt="'+esc((p?.name||o.product_name||'')+' official logo')+'" loading="lazy" referrerpolicy="no-referrer">':'E'};window.__evaOrders=rows;const renderOrders=(filter='all')=>{const list=rows.filter(o=>{const s=String(o.status||'').toLowerCase();if(filter==='all')return true;if(filter==='pending')return ['pending','processing','approved'].includes(s);if(filter==='completed')return ['delivered','completed'].includes(s);if(filter==='cancelled')return ['cancelled','refunded'].includes(s);return true});box.innerHTML=list.length?list.map(o=>'<article class="order"><div class="meta"><span>#'+esc(o.id||'')+'</span><span class="status '+esc(o.status)+'">'+({'pending':'待处理','processing':'处理中','approved':'已批准','delivered':'已交付','completed':'已完成','cancelled':'已取消','refunded':'已退款'}[String(o.status||'').toLowerCase()]||esc(o.status||'待处理'))+'</span></div><div class="row"><div class="logo">'+productLogo(o)+'</div><div><div class="name">'+esc(o.product_name)+'</div><div class="sub">'+new Date(o.created_at).toLocaleString()+'</div></div><div class="price">US$ '+Number(o.price_usd||0).toFixed(2)+'</div></div><div class="details"><button type="button">查看详情</button></div></article>').join(''):'<p class="notice">暂无订单</p>'};renderOrders();document.querySelectorAll('.tabs button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderOrders(btn.dataset.filter||'all')});}catch(e){box.innerHTML='';notice.textContent=e.message}})();
</script></body></html>
