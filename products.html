*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;font-family:Inter,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
.app-container{width:100%;max-width:400px;background:#05010a;min-height:100svh;height:100svh;position:relative;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;box-shadow:0 0 50px rgba(74,21,168,.2);padding-bottom:92px}
.app-container::-webkit-scrollbar,.hide-scroll::-webkit-scrollbar{display:none}.app-container,.hide-scroll{scrollbar-width:none}
.glow-bg-1{position:absolute;top:15%;left:-20%;width:250px;height:250px;background:radial-gradient(circle,rgba(65,23,143,.15),rgba(5,1,10,0) 70%);pointer-events:none}
.glow-bg-2{position:absolute;top:45%;right:-30%;width:300px;height:300px;background:radial-gradient(circle,rgba(58,38,153,.12),rgba(5,1,10,0) 70%);pointer-events:none}

.eva-head{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 20px 16px;position:relative;z-index:20}
.eva-brand{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none}
.eva-logo{width:36px;height:36px;display:grid;place-items:center}
.eva-brand b{display:block;font-size:14px;font-weight:800;letter-spacing:.03em;line-height:1.15}
.eva-brand small{display:block;font-size:7.5px;color:#7d7398;font-weight:700;letter-spacing:.16em;margin-top:1px}
.eva-head-actions{display:flex;gap:10px}
.icon-btn{width:34px;height:34px;background:#100a1d;border:1px solid #2d2242;border-radius:10px;display:grid;place-items:center;color:#fff}
.eva-search-wrap{padding:0 20px;margin-bottom:16px;position:relative;z-index:20}
.eva-search{display:flex;height:42px;background:#130b24;border:1px solid #2d2242;border-radius:12px;overflow:hidden}
.eva-search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;padding:0 14px;font-size:13px;font-weight:500}
.eva-search input::placeholder{color:#6b6284}
.eva-search button{width:42px;border:0;background:#5d1bf0;color:#fff;display:grid;place-items:center}
.chips-wrap{padding:0 20px;margin-bottom:20px;position:relative;z-index:20}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:1px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:6px 16px;border-radius:10px;background:#110b1e;border:1px solid #2d2242;color:#9ca3af;font-size:11px;font-weight:600;white-space:nowrap}
.chips button.active{background:#6a24ff;border-color:#6a24ff;color:#fff;box-shadow:0 0 15px rgba(106,36,255,.3)}
.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 20px 18px;position:relative;z-index:20}
.product-card{height:180px;padding:14px;display:flex;flex-direction:column;position:relative;min-width:0}
.product-top{display:flex;align-items:center;justify-content:center;position:relative;margin-top:8px}
.product-logo{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:#110a17;color:#ae71ff;font-size:28px;font-weight:900;box-shadow:0 4px 15px rgba(108,50,252,.12)}
.heart{position:absolute;right:-2px;top:-8px;color:#a586d3;font-size:20px}
.product-card h3{text-align:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:-.01em;margin:12px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-card .price{text-align:center;color:#fff;font-weight:800;font-size:15px;line-height:1.1}
.product-card .price small{color:#59a8b9;font-size:10px;font-weight:600}
.buy{width:100%;padding:8px 0;border:0;border-radius:10px;background:linear-gradient(90deg,#6222f5,#7b3dff);box-shadow:0 2px 10px rgba(98,34,245,.3);color:#fff;font-size:12px;font-weight:600;margin-top:auto}.buy:active{transform:scale(.96)}
.notice{grid-column:1/-1;padding:14px;border:1px solid #2d2242;border-radius:12px;background:#110b1e;color:#b9abc9;font-size:12px;text-align:center}
.eva-bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:400px;height:75px;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 18px calc(env(safe-area-inset-bottom) / 2);background:rgba(8,4,15,.9);backdrop-filter:blur(12px);border-top:1px solid rgba(45,34,66,.8)}
.eva-bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#73688a;text-decoration:none;font-size:9.5px;font-weight:500}.eva-bottom a.active{color:#a975ff}.eva-bottom a span{font-size:22px}
.spider-orb{width:60px!important;height:60px!important;margin-top:-32px!important;justify-self:center!important;border-radius:50%!important;border:1px solid rgba(138,43,226,.55)!important;background:radial-gradient(circle at 50% 45%,rgba(151,72,255,.62),#0b0514 68%)!important;box-shadow:0 -5px 25px rgba(116,44,224,.4)!important;color:#d5a5ff!important;font-size:29px!important}
.drawer{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.64)}.drawer[hidden]{display:none}.drawer-panel{position:absolute;right:0;top:0;width:min(82%,330px);height:100%;padding:78px 24px 24px;background:linear-gradient(180deg,rgba(5,7,18,.99),rgba(10,4,22,.98));border-left:1px solid #6f2cad;box-shadow:-20px 0 60px rgba(65,0,130,.38)}.drawer-close{position:absolute;right:18px;top:20px;font-size:24px}.drawer-brand{margin-bottom:24px}.drawer-brand .eva-crown{color:#c257ff;font-size:45px}.drawer-brand b{display:block;color:#fff;font-size:16px;margin-top:4px}.drawer-brand small{color:#8f82aa;font-size:8px;letter-spacing:.18em}.drawer nav a{display:flex;align-items:center;min-height:48px;color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.04);font-size:14px}.drawer-login{position:absolute;left:24px;right:24px;bottom:28px;height:48px;border:1px solid #9639e8;border-radius:12px;display:grid;place-items:center;color:#fff;text-decoration:none}
