<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080510"><title>Account — EVA AI MARKET</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body class="account-page"><div class="glow glow-a"></div><div class="glow glow-b"></div><main class="account-shell"><a class="brand" href="/"><span class="brand-mark">E</span><span>EVA AI MARKET</span></a><section class="auth-card panel"><div class="heading left compact"><span>Secure account</span><h1 class="account-title">Customer access</h1><p>Sign in to view your real balance, deposits and API usage.</p></div><div class="auth-tabs"><button class="active" data-auth-tab="login" type="button">Sign in</button><button data-auth-tab="signup" type="button">Create account</button></div><form id="login-form" class="auth-form"><label>Email<input id="login-email" type="email" autocomplete="email" required></label><label>Password<input id="login-password" type="password" autocomplete="current-password" minlength="8" required></label><button class="button primary" type="submit">Sign in</button></form><form id="signup-form" class="auth-form" hidden><label>Email<input id="signup-email" type="email" autocomplete="email" required></label><label>Password<input id="signup-password" type="password" autocomplete="new-password" minlength="8" required></label><small>Use at least 8 characters. Never reuse your API-key password.</small><button class="button primary" type="submit">Create account</button></form><p id="auth-status" class="auth-status" role="status"></p><a class="back-link" href="/">← Back to website</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script></body></html>
