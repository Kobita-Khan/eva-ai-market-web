<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="EVA Market">
<link rel="manifest" href="/eva-market.webmanifest"><link rel="apple-touch-icon" href="/assets/icons/eva-app-192.png">
<title>Sign In — EVA AI MARKET</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body{background:#080b14;color:#e2e8f0;font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;overflow-x:hidden}
    .glass{background:rgba(15,23,42,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08)}
    .glow-cyan{box-shadow:0 0 25px rgba(0,242,254,.32)}
    .auth-form[hidden]{display:none!important}
    .auth-tab.active{background:linear-gradient(90deg,#06b6d4,#2563eb);color:#fff;box-shadow:0 0 20px rgba(6,182,212,.24)}
    .auth-status{min-height:20px;margin-top:14px;font-size:12px;text-align:center;color:#94a3b8}
    .auth-status.success{color:#34d399}.auth-status.error{color:#fb7185}
    .password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:#67e8f9}
    .password-toggle:hover{color:#fff}
  </style>

<!-- Vercel Web Analytics: strip query strings and URL fragments before collection -->
<script>
  window.va = window.va || function () {
    (window.vaq = window.vaq || []).push(arguments);
  };
  window.va('beforeSend', function (event) {
    var url = new URL(event.url);
    url.search = '';
    url.hash = '';
    return Object.assign({}, event, { url: url.toString() });
  });
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative selection:bg-cyan-500 selection:text-black">
  <div class="fixed top-10 left-10 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-0 right-0 w-[420px] h-[420px] bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="glass w-full max-w-md rounded-3xl p-6 sm:p-8 border border-slate-800 relative z-10 shadow-2xl">
    <div class="text-center mb-6">
      <a href="/" class="inline-flex items-center gap-2 mb-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center text-white text-lg glow-cyan">
          <i class="fa-solid fa-crown text-amber-300"></i>
        </div>
        <span class="font-extrabold text-xl tracking-wider text-white">EVA AI MARKET</span>
      </a>
      <h2 class="text-xl font-bold text-white">Welcome Back</h2>
      <p class="text-xs text-slate-400">Access your subscriptions and licenses</p>
    </div>

    <div class="flex p-1 bg-slate-950/80 rounded-2xl border border-white/10 mb-6">
      <button data-auth-tab="login" type="button" class="auth-tab active flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition">Sign In</button>
      <button data-auth-tab="signup" type="button" class="auth-tab flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-semibold text-slate-400 transition">Create Account</button>
    </div>

    <form id="login-form" class="auth-form space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
        <input type="email" id="login-email" autocomplete="email" inputmode="email" required placeholder="you@example.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:border-cyan-400 outline-none">
      </div>
      <div>
        <div class="flex items-center justify-between mb-1"><label class="block text-xs font-semibold text-slate-300">Password</label><button id="forgot-password" type="button" class="text-[11px] text-cyan-400 hover:underline">Forgot Password?</button></div>
        <div class="relative">
          <input type="password" id="login-password" autocomplete="current-password" minlength="8" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 pr-14 text-sm text-slate-200 focus:border-cyan-400 outline-none">
          <button class="password-toggle" type="button" data-toggle-password="login-password" aria-pressed="false">Show</button>
        </div>
      </div>
      <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold text-sm glow-cyan hover:opacity-90 transition">Sign In to Dashboard</button>
    </form>

    <form id="signup-form" class="auth-form space-y-4" hidden>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
        <input type="email" id="signup-email" autocomplete="email" inputmode="email" required placeholder="you@example.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:border-cyan-400 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Create Password</label>
        <div class="relative">
          <input type="password" id="signup-password" autocomplete="new-password" minlength="8" required placeholder="Minimum 8 characters" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 pr-14 text-sm text-slate-200 focus:border-cyan-400 outline-none">
          <button class="password-toggle" type="button" data-toggle-password="signup-password" aria-pressed="false">Show</button>
        </div>
      </div>
      <p class="text-[11px] text-slate-400">A verification email will be sent to confirm your account.</p>
      <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-black text-sm">Create Account</button>
    </form>

    <form id="verify-form" class="auth-form space-y-4" hidden>
      <div class="text-center">
        <h3 class="text-base font-bold text-white">Verify Your Email</h3>
        <p class="text-xs text-slate-400 mt-1">If your email contains a 6-digit verification code, enter it below for <strong id="verify-email" class="text-cyan-300"></strong>.</p>
      </div>
      <input id="verify-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center text-xl tracking-[.45em] font-extrabold text-white focus:border-cyan-400 outline-none">
      <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold text-sm">Verify & Continue</button>
      <div class="text-center"><button id="resend-code" type="button" class="text-xs text-cyan-400 hover:underline">Resend verification email</button></div>
    </form>

    <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>

    <div class="mt-6 text-center">
      <a href="/" class="text-xs text-cyan-400 hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Marketplace</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js?v=20260916-ios-pwa2"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/eva-market-sw.js',{scope:'/'}).catch(function(){});});}</script>
</body>
</html>
