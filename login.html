/* Neural Key production skin */
body{background:#030712;background-image:radial-gradient(at 50% 15%,rgba(139,92,246,.25),transparent 65%),radial-gradient(at 15% 85%,rgba(6,182,212,.18),transparent 55%),radial-gradient(at 85% 85%,rgba(236,72,153,.18),transparent 55%);font-family:"Plus Jakarta Sans",system-ui,sans-serif}
.neural-stage{perspective:1400px}.neural-card{background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(15,23,42,.9));backdrop-filter:blur(28px);border:1.5px solid rgba(255,255,255,.15);box-shadow:0 30px 70px -15px #000,0 0 50px rgba(56,189,248,.18),inset 0 1px rgba(255,255,255,.2);transform-style:preserve-3d;position:relative}.neural-brain{width:110px;height:110px;margin:-72px auto 8px;border-radius:50%;display:grid;place-items:center;font-size:55px;background:radial-gradient(circle,rgba(168,85,247,.32),transparent 65%);filter:drop-shadow(0 15px 24px rgba(56,189,248,.6));animation:brainHover 5.5s ease-in-out infinite}@keyframes brainHover{50%{transform:translateY(-8px) scale(1.03);filter:drop-shadow(0 22px 34px rgba(168,85,247,.75))}}.neural-badge{font:700 10px "JetBrains Mono",monospace;letter-spacing:.16em;color:#22d3ee;text-transform:uppercase}.neural-key-submit{width:100%;margin-top:18px;border:0;background:transparent;display:flex;justify-content:center;align-items:center;filter:drop-shadow(0 13px 18px #000)}.neural-key-submit .bow{width:62px;height:62px;border-radius:50%;z-index:2;display:grid;place-items:center;background:radial-gradient(circle at 35% 35%,#fff1c5,#d4a359 40%,#8c5a2b 75%,#422006);border:5px solid #b47834;color:#fde047;font-size:22px}.neural-key-submit .blade{margin-left:-14px;padding:10px 27px 10px 30px;border:6px solid #b47834;border-radius:999px;background:linear-gradient(#9333ea,#4c1d95);color:#fff;font-weight:900;letter-spacing:.15em;min-width:150px}.neural-card input{background:rgba(10,15,29,.85)!important;border-color:rgba(56,189,248,.45)!important;box-shadow:inset 0 2px 8px rgba(0,0,0,.8),0 0 14px rgba(56,189,248,.12)}.neural-card input:focus{border-color:#38bdf8!important;box-shadow:0 0 22px rgba(56,189,248,.32)}@media(max-width:620px){.neural-card{border-radius:28px!important;padding:26px 20px!important}.neural-brain{width:92px;height:92px;margin-top:-66px;font-size:46px}}

/* 3D Neural registration mode */
.neural-card.signup-active{border-color:rgba(217,70,239,.42);box-shadow:0 35px 80px -15px #000,0 0 48px rgba(168,85,247,.28),inset 0 1px rgba(255,255,255,.2)}
.signup-active .neural-brain{background:linear-gradient(135deg,#9333ea,#ec4899);width:78px;height:78px;margin-top:-56px;font-size:0;border-radius:20px;box-shadow:0 14px 28px rgba(217,70,239,.4);animation:signupFloat 5s ease-in-out infinite}
.signup-active .neural-brain:after{content:"👤";font-size:38px;filter:grayscale(1) brightness(3)}
@keyframes signupFloat{50%{transform:translateY(-5px) scale(1.03)}}
.signup-active #signup-form{padding-top:4px}.signup-active #signup-form input{border-color:rgba(255,255,255,.12)!important}.signup-active #signup-form input:focus{border-color:#d946ef!important;box-shadow:0 0 18px rgba(217,70,239,.32)}
.signup-create-btn{width:100%;padding:15px;border:0;border-radius:16px;background:linear-gradient(135deg,#a855f7,#ec4899);box-shadow:0 7px 0 #7e22ce,0 16px 25px rgba(168,85,247,.4);color:#fff;font-weight:900;letter-spacing:.06em}.signup-create-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #7e22ce,0 6px 12px rgba(168,85,247,.35)}
.signup-strength{height:4px;background:#ffffff12;border-radius:99px;overflow:hidden;margin-top:7px}.signup-strength>i{display:block;height:100%;width:0;background:#64748b;transition:.25s}.signup-strength-text{display:block;text-align:right;font:10px "JetBrains Mono",monospace;color:#94a3b8;margin-top:5px}

@media(max-width:600px){html,body{width:100%;max-width:100%;overflow-x:hidden}.neural-stage{width:100%;max-width:100%;padding-left:10px!important;padding-right:10px!important}.neural-card{width:100%!important;max-width:100%!important;margin-left:auto!important;margin-right:auto!important;box-sizing:border-box!important}input,button{max-width:100%!important}}
@media(max-width:360px){.neural-stage{padding-left:7px!important;padding-right:7px!important}}

    <form id="signup-form" class="auth-form space-y-4" hidden><div class="text-center mb-5"><span class="neural-badge" style="color:#e879f9">● Identity Provisioning</span><h2 style="margin:7px 0 3px;font-size:24px;font-weight:900;color:white">Create Account</h2><p style="margin:0;color:#94a3b8;font-size:12px">Create your EVA AI MARKET account</p></div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>

<script>
(()=>{const card=document.querySelector('.neural-card'),signup=document.getElementById('signup-form'),login=document.getElementById('login-form');const sync=()=>card&&card.classList.toggle('signup-active',!signup.hidden);new MutationObserver(sync).observe(signup,{attributes:true,attributeFilter:['hidden']});sync();window.evaStrength=v=>{const b=document.getElementById('signup-strength-bar'),t=document.getElementById('signup-strength-text');let s=0;if(v.length>=8)s++;if(v.length>=12)s++;if(/[A-Z]/.test(v))s++;if(/[0-9]/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;if(!v){b.style.width='0';b.style.background='#64748b';t.textContent='Strength: Empty';return}if(s<=2){b.style.width='33%';b.style.background='#f43f5e';t.textContent='Strength: Weak'}else if(s<=4){b.style.width='66%';b.style.background='#f59e0b';t.textContent='Strength: Moderate'}else{b.style.width='100%';b.style.background='#34d399';t.textContent='Strength: Strong'}}})();
</script><script src="/eva-premium-runtime.js?v=20260922-1"></script>
